global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: prod
    msp: mspshield

rule_files:
  - rules/common.yml
  - rules/ssl.yml
  - rules/site.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: mspshield-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["172.17.0.1:8001"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://msp-claude.online
          - https://msp-claude.online/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-https-strict
    metrics_path: /probe
    params:
      module: [https_strict]
    static_configs:
      - targets:
          - https://msp-claude.online
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-smtp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - msp-claude.online:587
          - msp-claude.online:465
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
