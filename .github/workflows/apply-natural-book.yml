name: Apply natural book rewrite
on:
  push:
    branches: [book/natural-coherent-edition]
permissions: {contents: write}
jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: book/natural-coherent-edition}
      - run: python .github/book_cleanup.py
      - run: |
          python -m compileall -q .github/book_cleanup.py
          grep -q 'Команда ничего не изменяет' book/chapters/02-исследование-незнакомой-системы-без-угадывания.md
          grep -q 'выручка, а не прибыль' book/chapters/28-деньги-и-время-язык-модели.md
      - run: |
          rm .github/book_cleanup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(book): remove template prose and explain core topics plainly'
          git push origin HEAD:book/natural-coherent-edition
