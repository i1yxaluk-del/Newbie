---
- name: guard — env content required
  ansible.builtin.assert:
    that: fastapi_env_content | length > 0
    fail_msg: "fastapi_env_content is empty. Decrypt from ansible-vault: group_vars/landing/vault.yml"

- name: install python + build deps
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - build-essential
      - git
    state: present

- name: system user
  ansible.builtin.user:
    name: "{{ fastapi_system_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ fastapi_install_dir }}"
    create_home: false

- name: install dir
  ansible.builtin.file:
    path: "{{ fastapi_install_dir }}"
    state: directory
    owner: "{{ fastapi_system_user }}"
    group: "{{ fastapi_system_user }}"
    mode: "0750"

- name: clone repo
  ansible.builtin.git:
    repo: "{{ fastapi_repo_url }}"
    dest: "{{ fastapi_install_dir }}"
    version: "{{ fastapi_repo_ref }}"
    force: true
  become_user: "{{ fastapi_system_user }}"
  notify: restart fastapi

- name: python venv + deps
  ansible.builtin.pip:
    requirements: "{{ fastapi_install_dir }}/backend/requirements.txt"
    virtualenv: "{{ fastapi_install_dir }}/.venv"
    virtualenv_command: "python3 -m venv"
  become_user: "{{ fastapi_system_user }}"
  notify: restart fastapi

- name: env dir
  ansible.builtin.file:
    path: /etc/mspshield
    state: directory
    owner: root
    group: "{{ fastapi_system_user }}"
    mode: "0750"

- name: deploy env file (from vault)
  ansible.builtin.copy:
    dest: /etc/mspshield/backend.env
    content: "{{ fastapi_env_content }}"
    owner: root
    group: "{{ fastapi_system_user }}"
    mode: "0640"
  notify: restart fastapi
  no_log: true

- name: systemd unit
  ansible.builtin.template:
    src: mspshield-backend.service.j2
    dest: /etc/systemd/system/mspshield-backend.service
    mode: "0644"
  notify: restart fastapi

- name: systemd enabled + started
  ansible.builtin.systemd:
    name: mspshield-backend
    enabled: true
    daemon_reload: true
    state: started
