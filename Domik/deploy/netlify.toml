[build]
  base    = "frontend"
  publish = "frontend/dist"
  command = "npm ci && npm run build"

[[redirects]]
  from = "/api/*"
  to   = "https://REPLACE-WITH-BACKEND.onrender.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from = "/uploads/*"
  to   = "https://REPLACE-WITH-BACKEND.onrender.com/uploads/:splat"
  status = 200
  force  = true

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
