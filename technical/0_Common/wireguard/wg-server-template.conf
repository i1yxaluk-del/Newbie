# ═══════════════════════════════════════════════════════════════════
# wg-server-template.conf — Шаблон WireGuard SERVER (Bastion)
# Размещение: /etc/wireguard/wg0.conf (на Monitoring/Bastion VM)
# Источник: 0_Common/wireguard/wg-server-template.conf
#
# ЧТО ДЕЛАЕТ ЭТОТ КОНФИГ:
#   - WireGuard сервер слушает UDP 51820
#   - VPN-сеть: 10.9.0.0/24
#   - Bastion IP: 10.9.0.1
#   - NAT: VPN-клиенты могут ходить в интернет через Bastion (опционально)
#   - Peers добавляются при онбординге клиентов
#
# ПЕРЕД ЗАПУСКОМ:
#   1. Сгенерировать ключи: wg genkey | tee server_private.key | wg pubkey > server_public.key
#   2. Заменить <SERVER_PRIVATE_KEY> на реальный приватный ключ
#   3. Включить IP forwarding: sysctl -w net.ipv4.ip_forward=1
# ═══════════════════════════════════════════════════════════════════

[Interface]
PrivateKey = <SERVER_PRIVATE_KEY>
Address = 10.9.0.1/24
ListenPort = 51820

# NAT — позволяет VPN-клиентам ходить в интернет через Bastion
# PostUp выполняется при запуске туннеля
# PostDown выполняется при остановке туннеля
PostUp   = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# ═══════════════════════════════════════════════════════════════════
# PEERS КЛИЕНТОВ — добавлять при онбординге
# Формат:
#   [Peer]
#   PublicKey = <CLIENT_PUBLIC_KEY>
#   AllowedIPs = <VPN_IP>/32
#
# Диапазоны IP для клиентов:
#   Клиент 1: 10.9.0.10–10.9.0.19
#   Клиент 2: 10.9.0.20–10.9.0.29
#   Клиент 3: 10.9.0.30–10.9.0.39
#   ...
#   Каждый клиент — блок по 10 IP
# ═══════════════════════════════════════════════════════════════════

# === Клиент: EXAMPLE_COMPANY (добавлен 2026-04-20) ===
# [Peer]
# PublicKey = <EXAMPLE_PUBLIC_KEY>
# AllowedIPs = 10.9.0.10/32
