groups:
- name: services
  rules:
    - alert: VaultwardenDown
      expr: probe_success{job="blackbox-internal", instance="http://vaultwarden:80"} == 0
      for: 3m
      labels:
        severity: P1
      annotations:
        summary: "vaultwarden · менеджер паролей недоступен более 3 мин"
        host: "node-01.msp-claude.online"
        metric: 'probe_success = 0'
        runbook: "docs/R-vault-down"

    - alert: GrafanaDown
      expr: probe_success{job="blackbox-internal", instance="http://grafana:3000/api/health"} == 0
      for: 3m
      labels:
        severity: P2
      annotations:
        summary: "grafana · мониторинг недоступен более 3 мин"
        host: "node-01.msp-claude.online"
        metric: 'probe_success = 0'
        runbook: "docs/R-grafana-down"

    - alert: StalwartImapDown
      expr: probe_success{job="blackbox-imap"} == 0
      for: 3m
      labels:
        severity: P1
      annotations:
        summary: "stalwart · IMAP {{ $labels.instance }} недоступен — почта не работает"
        host: "node-01.msp-claude.online"
        metric: 'probe_success = 0'
        runbook: "docs/R-imap-down"

    - alert: StalwartSmtpDown
      expr: probe_success{job="blackbox-smtp"} == 0
      for: 3m
      labels:
        severity: P1
      annotations:
        summary: "stalwart · SMTP {{ $labels.instance }} недоступен — отправка почты не работает"
        host: "node-01.msp-claude.online"
        metric: 'probe_success = 0'
        runbook: "docs/R-smtp-down"

    - alert: ServiceSlowResponse
      expr: probe_duration_seconds{job=~"blackbox-http|blackbox-internal"} > 3
      for: 5m
      labels:
        severity: P3
      annotations:
        summary: "{{ $labels.instance }} · ответ >3s за 5 мин"
        host: "node-01.msp-claude.online"
        metric: 'probe_duration = {{ $value | printf "%.1f" }}s'
        runbook: "docs/R-slow"
