name: Apply complete book rewrite
on:
  push:
    branches: [book/full-readable-rewrite-v3]
permissions: {contents: write}
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: book/full-readable-rewrite-v3}
      - run: python .github/rewrite_book_complete.py
      - run: python book/verify_readability.py
      - run: python scripts/validate_markdown_links.py
      - run: |
          rm .github/rewrite_book_complete.py .github/workflows/apply-book-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(book): replace old book with coherent owner textbook'
          git push origin HEAD:book/full-readable-rewrite-v3
