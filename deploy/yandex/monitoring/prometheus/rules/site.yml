groups:
  - name: site
    rules:
      - alert: SiteDown
        expr: probe_success{job=~"blackbox.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Site {{ $labels.instance }} is DOWN"

      - alert: SSLExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL cert expiring in <14d for {{ $labels.instance }}"

      - alert: SSLExpired
        expr: (probe_ssl_earliest_cert_expiry - time()) < 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SSL cert EXPIRED for {{ $labels.instance }}"

      - alert: SiteSlowResponse
        expr: probe_duration_seconds{job=~"blackbox-http.*"} > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Site {{ $labels.instance }} slow (>5s)"

      - alert: SMTPPortDown
        expr: probe_success{job="blackbox-smtp"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SMTP port {{ $labels.instance }} is DOWN"

      - alert: BackendHealthFail
        expr: up{job="mspshield-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MSPShield backend /metrics unreachable"

      - alert: HighErrorRate5xx
        expr: rate(mspshield_leads_rejected_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High lead rejection rate on backend"
