---
- name: guard — private key required
  ansible.builtin.assert:
    that: wg_hub_private_key | length > 0
    fail_msg: "wg_hub_private_key пустой. Получи через wg_bootstrap.sh и положи в vault."

- name: install wireguard
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
      - qrencode
    state: present

- name: enable ip_forward
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-wg.conf

- name: wg0.conf from template
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: restart wg-quick
  no_log: true

- name: ufw open wg port
  community.general.ufw:
    rule: allow
    port: "{{ wg_hub_listen_port }}"
    proto: udp

- name: enable wg-quick@wg0
  ansible.builtin.systemd:
    name: "wg-quick@wg0"
    enabled: true
    state: started
