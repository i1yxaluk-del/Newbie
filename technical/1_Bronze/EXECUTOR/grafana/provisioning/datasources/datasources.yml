apiVersion: 1
# ═══════════════════════════════════════════════════════════════════
# Grafana Datasources — автоматический провиженинг
# Файл: /opt/monitoring/grafana/provisioning/datasources/datasources.yml
#
# Grafana при старте автоматически настраивает эти datasources.
# Изменения в UI не сохраняются (управляется кодом).
# ═══════════════════════════════════════════════════════════════════

datasources:

  # ── Prometheus (основной) ─────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: "2.51.0"
      cacheLevel: "Low"
      exemplarTraceIdDestinations: []
      incrementalQueryOverlapWindow: "10m"
    version: 1

  # ── Loki (Silver/Gold) ────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 5000
      timeout: 60
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "(?:traceID|trace_id)=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
    version: 1
