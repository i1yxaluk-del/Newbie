# ═══════════════════════════════════════════════════════════════════
# wg-client-template.conf — Шаблон WireGuard КЛИЕНТА (Linux)
# Размещение: /etc/wireguard/wg0-msp.conf (на сервере клиента)
# Источник: 0_Common/wireguard/wg-client-template.conf
#
# ЧТО ДЕЛАЕТ ЭТОТ КОНФИГ:
#   - Подключается к WireGuard серверу Исполнителя
#   - Направляет трафик в VPN-сеть 10.9.0.0/24
#   - DNS: Yandex DNS (77.88.8.8) — для РФ
#   - PersistentKeepalive: держит туннель живым за NAT
#
# ЗАПОЛНИТЬ ПЕРЕД УСТАНОВКОЙ:
#   1. <CLIENT_PRIVATE_KEY> — сгенерировать на сервере: wg genkey
#   2. <CLIENT_VPN_IP> — назначается Исполнителем (например 10.9.0.10)
#   3. <BASTION_PUBLIC_KEY> — публичный ключ Bastion (даёт Исполнитель)
#   4. <BASTION_PUBLIC_IP> — внешний IP Bastion (даёт Исполнитель)
# ═══════════════════════════════════════════════════════════════════

[Interface]
PrivateKey = <CLIENT_PRIVATE_KEY>
Address = <CLIENT_VPN_IP>/32     # Например: 10.9.0.10/32
DNS = 77.88.8.8, 77.88.8.1       # Yandex DNS — рекомендуется для РФ

[Peer]
PublicKey = <BASTION_PUBLIC_KEY>
Endpoint = <BASTION_PUBLIC_IP>:51820    # Внешний IP Bastion
AllowedIPs = 10.9.0.0/24               # Только VPN-трафик (не весь интернет!)
PersistentKeepalive = 25                # Держать туннель живым за NAT

# ═══════════════════════════════════════════════════════════════════
# ПОСЛЕ СОЗДАНИЯ КОНФИГА:
#   chmod 600 /etc/wireguard/wg0-msp.conf   # Приватный ключ = секрет!
#   systemctl enable --now wg-quick@wg0-msp
#   ping 10.9.0.1                           # Проверить связь с Bastion
# ═══════════════════════════════════════════════════════════════════
