# ═══════════════════════════════════════════════════════════════════
# Prod-стек на VM в Yandex Cloud:
#   mongo    — БД (volume на host, expose только в docker-сеть)
#   backend  — FastAPI (expose 127.0.0.1:8001, Caddy на хосте проксирует)
#
# Запуск:  cd /opt/msp/Newbie/deploy/yandex && docker compose up -d
# Логи:    docker compose logs -f
# Стоп:    docker compose down
# ═══════════════════════════════════════════════════════════════════
name: msp

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # MongoDB доступна ТОЛЬКО внутри docker-сети, наружу не светим.
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/yandex/Dockerfile.backend
    restart: unless-stopped
    env_file: ../../backend/.env
    # Переопределяем MONGO_URL — внутри compose-сети mongo доступна по имени.
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: mspshield
    # 0.0.0.0:8001 — слушаем все интерфейсы (Caddy проксирует через хост,
    # Prometheus скрейпит через Docker-сеть msp_default).
    # UFW не открывает 8001 — порт доступен только изнутри VM/Docker.
    ports:
      - "0.0.0.0:8001:8001"
    depends_on:
      mongo:
        condition: service_healthy

  # ─── Stalwart Mail Server (relay/submit-only режим) ──────────────
  # Документация: https://stalw.art/docs/install/platform/docker/
  #
  # ВАЖНО · Yandex Cloud блокирует TCP/25 на публичных IP VPC:
  #   Исходящий трафик с публичных IP VPC на TCP/25 автоматически
  #   блокируется (анти-спам). Получить адрес с открытым :25 в YC
  #   сейчас технически невозможно. Поэтому Stalwart работает в
  #   submit-only режиме: только 465/587 для отправки + 143/993 для
  #   чтения локальных ящиков. Inbound MX-приём почты к нашему IP
  #   не работает — внешний MX-провайдер (Yandex 360 для бизнеса,
  #   Mail.ru для бизнеса, Mailgun routes) принимает почту и
  #   forwards на наш :587. Полное руководство: STALWART_RELAY_MODE.md
  #
  # Активные порты:
  #   465   — SMTPS submission (implicit TLS) — клиенты шлют ИСХОДЯЩЕЕ
  #   587   — STARTTLS submission — Grafana/Wazuh/Alertmanager шлют АЛЕРТЫ
  #   143   — IMAP STARTTLS (для legacy клиентов)
  #   993   — IMAPS (TLS) — основное чтение ящиков
  #   4190  — ManageSieve (фильтры на сервере)
  #   8080  — Admin WebUI (БЕЗ публичного выхода — bind на 127.0.0.1, SSH tunnel)
  #
  # Закрыто (заблокировано Yandex Cloud):
  #   25    — НЕ открываем. Outgoing к чужим :25 всё равно режется YC.
  #           Outbound идёт через smarthost (Yandex 360 / Mailgun / Brevo)
  #           на их :465 или :587 (настраивается в Stalwart admin UI).
  #
  # TLS-сертификаты для mail.<domain> Caddy получает у Let's Encrypt и
  # Stalwart читает их через bind-mount /var/lib/caddy → /etc/stalwart-certs:ro
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    restart: unless-stopped
    environment:
      # Bootstrap admin (первый вход в WebUI). Пароль генерируется
      # setup-on-vm.sh и пишется в ~/msp-deploy-secrets.txt
      STALWART_RECOVERY_ADMIN: "admin:${STALWART_ADMIN_PASSWORD:-changeme}"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
      # Read-only mount Caddy cert store — Stalwart читает PEM-файлы напрямую.
      # Caddy перевыпускает сертификаты автоматически каждые 60 дней,
      # Stalwart автоматически подхватывает новые (watch на mtime файлов).
      - /var/lib/caddy:/etc/stalwart-certs:ro
    ports:
      # Submission / IMAP — публично на всех интерфейсах.
      # Порт 25 НЕ открываем (см. комментарий выше — YC блокирует).
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "4190:4190"
      # Admin WebUI — ТОЛЬКО локально (доступ через SSH tunnel)
      - "127.0.0.1:8080:8080"

volumes:
  mongo-data:
    driver: local
  stalwart-etc:
    driver: local
  stalwart-data:
    driver: local
