---
# ──────────────────────────────────────────────────────────────
# patch_nondisruptive.yml · безопасное обновление БЕЗ ребута
# ──────────────────────────────────────────────────────────────
# RU: Обновляет пакеты, где это не требует перезагрузки сервиса.
# Запускается еженедельно по cron / GitHub Actions (см. R-10 runbook).
# Для патчей с ребутом используется patch_disruptive.yml (только в
# согласованное patch-window клиента).
#
# Переменные:
#   client — ограничение по группе хостов (по умолчанию tenants).
# Пример:
#   ansible-playbook playbooks/patch_nondisruptive.yml -e client=acme
# ──────────────────────────────────────────────────────────────
- hosts: "{{ client | default('tenants') }}"
  become: true
  serial: 1
  tasks:
    - name: apt update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: apt safe-upgrade
      ansible.builtin.apt:
        upgrade: safe
        autoremove: true
      when: ansible_os_family == "Debian"

    - name: dnf update (security only)
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: true
      when: ansible_os_family == "RedHat"
