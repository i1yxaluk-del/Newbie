groups:
  - name: backups
    rules:
      - alert: BackupFailed
        expr: restic_backup_last_status == 0
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "restic · последний бэкап завершился с ошибкой"
          host: "node-01.msp-claude.online"
          metric: 'restic_backup_last_status = 0'
          runbook: "runbooks/R-backup-failed"

      - alert: BackupMissed24h
        expr: (time() - restic_backup_last_timestamp_seconds) > 93600
        for: 10m
        labels:
          severity: P1
        annotations:
          summary: "restic · бэкап не запускался более 26 часов"
          host: "node-01.msp-claude.online"
          metric: 'hours_since_last = {{ $value | printf "%.0f" }}s'
          runbook: "runbooks/R-backup-missed"

      - alert: BackupSizeDropped
        expr: restic_backup_size_bytes < on(host) avg_over_time(restic_backup_size_bytes[7d]) * 0.5
        for: 15m
        labels:
          severity: P2
        annotations:
          summary: "restic · размер бэкапа упал >50% от среднего за 7 дней"
          host: "node-01.msp-claude.online"
          metric: 'size = {{ $value | printf "%.0f" }} bytes'
          runbook: "runbooks/R-backup-size-dropped"

      - alert: BackupInProgress
        expr: restic_backup_last_status == 2
        for: 30m
        labels:
          severity: P3
        annotations:
          summary: "restic · бэкап выполняется более 30 минут"
          host: "node-01.msp-claude.online"
          metric: 'restic_backup_last_status = 2 (in progress)'
          runbook: "runbooks/R-backup-long"
