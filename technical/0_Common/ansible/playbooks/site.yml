---
# ──────────────────────────────────────────────────────────────
# site.yml · альтернативная схема nginx/systemd, НЕ текущая Caddy/Compose VM
# ──────────────────────────────────────────────────────────────
# RU: Точка входа для Ansible. Запускается после `terraform apply`
# и разовой инициализации bastion'а (awg_bootstrap.sh).
#
# Что делает:
#   1. baseline на ВСЕХ хостах (SSH hardening, auditd, unattended-upgrades).
#   2. landing-стек (nginx + FastAPI + mongo) только на mspshield-landing.
#   3. AmneziaWG-hub (форк WireGuard с обфускацией handshake против РКН-DPI)
#      только на mspshield-bastion. См. docs/runbooks/R-08.md.
#   4. Ниже есть только этапы tier_bronze и tier_silver, не tier_gold.
# Оба этапа выберут одну группу tenants при запуске без --tags: это не выбор тарифа.
# До применения проверить --list-hosts и --list-tasks с конкретными --limit/--tags.
#
# Запуск полного прогона:
#   ansible-playbook playbooks/site.yml
# Точечный прогон (только landing):
#   ansible-playbook playbooks/site.yml --limit landing
# Только один тенант Silver:
#   ansible-playbook playbooks/site.yml --tags tier_silver --limit acme
# ──────────────────────────────────────────────────────────────

# baseline не имеет тарифного тега: запуск с --tags может его пропустить.
# Роль меняет SSH/UFW, а landing ниже создаёт отдельные systemd/Mongo-службы.

- name: Baseline hardening (all hosts)
  hosts: all
  become: true
  roles:
    - baseline

- name: Landing stack
  hosts: landing
  become: true
  roles:
    - nginx
    - fastapi_backend
    - mongo
    - alertmanager

- name: Bastion
  hosts: bastion
  become: true
  roles:
    - awg_hub

- name: Bronze tenants
  hosts: tenants
  become: true
  tags: tier_bronze
  roles:
    - monitoring_agent
    - restic_client
    - base_hardening

- name: Silver tenants (AD + Ansible-managed)
  hosts: tenants
  become: true
  tags: tier_silver
  roles:
    - monitoring_agent
    - restic_client
    - base_hardening
    - ad_health_check
