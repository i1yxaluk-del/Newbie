groups:
  - name: site
    rules:
      - alert: SiteDown
        expr: probe_success{job=~"blackbox-http|blackbox-https-strict"} == 0
        for: 2m
        labels:
          severity: P1
        annotations:
          summary: "{{ $labels.instance }} · сайт недоступен более 2 мин"
          host: "node-01.msp-claude.online"
          metric: 'probe_success = 0'
          runbook: "site/site-down"

      - alert: BackendHealthFail
        expr: up{job="mspshield-backend"} == 0
        for: 2m
        labels:
          severity: P1
        annotations:
          summary: "backend · /metrics недоступен более 2 мин"
          host: "node-01.msp-claude.online"
          metric: 'up{job="mspshield-backend"} = 0'
          runbook: "site/backend-down"

      - alert: SiteSlowResponse
        expr: probe_duration_seconds{job=~"blackbox-http.*"} > 5
        for: 5m
        labels:
          severity: P3
        annotations:
          summary: "{{ $labels.instance }} · ответ >5s за 5 мин"
          host: "node-01.msp-claude.online"
          metric: 'probe_duration = {{ $value | printf "%.1f" }}s'
          runbook: "site/slow"

      - alert: HighErrorRate5xx
        expr: rate(mspshield_leads_rejected_total[5m]) > 0.1
        for: 5m
        labels:
          severity: P3
        annotations:
          summary: "backend · высокий процент отклонений лидов"
          host: "node-01.msp-claude.online"
          metric: 'rate = {{ $value | printf "%.2f" }}'
          runbook: "site/5xx"
