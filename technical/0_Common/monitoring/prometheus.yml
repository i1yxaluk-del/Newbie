# ──────────────────────────────────────────────────────────────
# Prometheus scrape config · MSPShield
# ──────────────────────────────────────────────────────────────
# RU: Работает на mspshield-landing (можно вынести на отдельную
# monitoring-VM, когда > 5 тенантов). Собирает метрики по WireGuard-
# оверлею из тенант-сетей (10.20.x.x).
#
# Файлы таргетов подкладываются Ansible'ом:
#   targets/node/<tenant>.yml     — node_exporter (каждый хост)
#   targets/tenants/<tenant>.yml  — app-уровень (nginx_exporter и пр.)
#
# Правила алёртов — в rules/. Алёрты летят в Alertmanager на 127.0.0.1:9093.
# ──────────────────────────────────────────────────────────────

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: prod
    msp: mspshield

rule_files:
  - rules/common.yml
  - rules/backups.yml
  - rules/ssl.yml
  - rules/ad.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: self
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    file_sd_configs:
      - files: ["targets/node/*.yml"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "(.+):9100"
        target_label: instance

  - job_name: mspshield-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8001"]

  - job_name: wireguard
    static_configs:
      - targets: ["10.10.0.1:9586"]

  # Per-tenant file_sd — populated by Ansible from inventory.
  - job_name: tenant-nodes
    file_sd_configs:
      - files: ["targets/tenants/*.yml"]
