;═══════════════════════════════════════════════════════════════════
; MSPShield — Grafana Server Configuration
;═══════════════════════════════════════════════════════════════════
; Подгоняем Grafana под фирстиль сайта msp-claude.online:
;   - Cream/forest light theme (фон #f7f4ee, бренд #1b4d3e)
;   - Шрифты Cormorant Garamond (заголовки) + DM Sans (текст) + DM Mono (числа)
;   - Минимум визуального шума: радиус 4px, тонкие границы, без glow
;
; Большинство опций здесь продублированы из docker-compose env vars
; (GF_*). ENV переменные имеют приоритет — этот файл монтируется как
; источник дефолтов для тех опций, которые удобнее держать в файле
; (типа кастомных URL и branding).
;═══════════════════════════════════════════════════════════════════

[server]
; Корневой URL — переопределяется GF_SERVER_ROOT_URL из compose
root_url = http://127.0.0.1:3000
serve_from_sub_path = false

[users]
; Светлая тема по умолчанию — соответствует сайту MSPShield
default_theme = light
; Запретить пользователям менять тему на dark (для бренд-консистентности
; — если нужно разрешить, поменять на = true)
default_language = ru-RU
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth]
disable_login_form = false
disable_signout_menu = false

[auth.anonymous]
enabled = false

[security]
; Включает custom branding через grafana.ini
allow_embedding = false
cookie_secure = false
disable_gravatar = true
; CSP — разрешаем Google Fonts для Cormorant Garamond + DM Sans + DM Mono
; (по умолчанию Grafana блокирует внешние шрифты)
content_security_policy = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[snapshots]
external_enabled = false

[dashboards]
; Каталог где лежат JSON дашборды (монтируется из ./grafana/dashboards)
versions_to_keep = 10
min_refresh_interval = 10s
default_home_dashboard_path = /var/lib/grafana/dashboards/mspshield-overview.json

[alerting]
enabled = false

[unified_alerting]
enabled = false

[panels]
disable_sanitize_html = false
enable_alpha = false

[log]
mode = console
level = warn
filters =

[metrics]
enabled = true
disable_total_stats = false

;═══════════════════════════════════════════════════════════════════
; Branding (Grafana Enterprise only — игнорируется в OSS)
; Оставляем для будущего: при апгрейде на Enterprise активируется
;═══════════════════════════════════════════════════════════════════
[white_labeling]
app_title = MSPShield Monitoring
login_logo =
login_background =
menu_logo =
fav_icon =
footer_links_enabled = false

[plugins]
allow_loading_unsigned_plugins =
plugin_admin_enabled = false
plugin_admin_external_manage_enabled = false
