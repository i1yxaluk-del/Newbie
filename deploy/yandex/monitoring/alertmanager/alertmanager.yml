global:
  resolve_timeout: 5m
  smtp_smarthost: "stalwart:25"
  smtp_from: "MSPShield <alert@msp-claude.online>"
  smtp_hello: "msp-claude.online"
  smtp_auth_username: "alert@msp-claude.online"
  smtp_auth_password: "QYIQylBaBRenxvvKuxLVx5Yq"
  smtp_require_tls: false

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: email-alert

  routes:
    - matchers:
        - severity = P1
      receiver: telegram-alert
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h
      continue: true

    - matchers:
        - severity = P1
      receiver: email-alert
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h
      continue: true

    - matchers:
        - severity = P1
      receiver: msp-backend
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h

    - matchers:
        - severity =~ "P2|P3"
      receiver: email-alert
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 4h
      continue: true

    - matchers:
        - severity =~ "P2|P3"
      receiver: msp-backend
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 4h

receivers:
  - name: msp-backend
    webhook_configs:
      - url: 'https://msp-claude.online/api/alerts/alertmanager'
        send_resolved: true
        max_alerts: 0
        http_config:
          authorization:
            type: Bearer
            credentials: '54f48bc96cee9efb244f270d8a50486e648519dd841f74c66b12f578a35bce41'

  - name: telegram-alert
    webhook_configs:
      - url: 'http://127.0.0.1:9119/alerts'
        send_resolved: true

  - name: email-alert
    email_configs:
      - to: "alert@msp-claude.online"
        send_resolved: true
        html: '{{ template "mspshield.alert.html" . }}'
        text: '{{ template "mspshield.alert.text" . }}'
        headers:
          Subject: '{{ template "mspshield.subject" . }}'
          Auto-Submitted: auto-generated
          Precedence: bulk
          List-ID: "MSPShield Alerts <alerts.msp-claude.online>"
          List-Unsubscribe: "<https://msp-claude.online>"
          X-Mailer: "MSPShield Alertmanager"
          X-Priority: '{{ if eq .Status "firing" }}1{{ else }}3{{ end }}'

inhibit_rules:
  - source_matchers:
      - severity = P1
    target_matchers:
      - severity =~ "P2|P3"
    equal: ['alertname', 'instance']
