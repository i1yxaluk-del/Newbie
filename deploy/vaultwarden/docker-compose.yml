# Vaultwarden self-hosted — secrets vault for MSPShield and clients.
# Moved to deploy/yandex/docker-compose.yml (single-VM deployment behind Caddy). This file kept as standalone reference.
# Reference: https://github.com/dani-garcia/vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:latest
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.msp-claude.online
      SIGNUPS_ALLOWED: "false"         # invites only
      INVITATIONS_ALLOWED: "true"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}  # from env/secret store
      WEBSOCKET_ENABLED: "true"
      LOG_FILE: /data/vaultwarden.log
      LOG_LEVEL: warn

    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:3012:3012"    # websocket

  # nginx reverse proxy with Let's Encrypt is separate (shared across services)
