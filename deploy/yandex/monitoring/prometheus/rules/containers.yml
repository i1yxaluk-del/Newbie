groups:
- name: containers
  rules:
    - alert: ContainerDown
      expr: |
        absent(container_last_seen{name=~".+"})
        or
        time() - container_last_seen{name=~".+"} > 120
      for: 3m
      labels:
        severity: P1
      annotations:
        summary: "{{ $labels.name }} · контейнер не виден более 2 мин"
        host: "node-01.msp-claude.online"
        metric: 'last_seen = {{ $value | printf "%.0f" }}s ago'
        runbook: "docs/R-container-down"

    - alert: ContainerRestartLoop
      expr: |
        increase(container_start_time_seconds{name=~".+"}[15m]) > 2
      for: 0m
      labels:
        severity: P2
      annotations:
        summary: "{{ $labels.name }} · рестарт-луп (>2 перезапусков за 15 мин)"
        host: "node-01.msp-claude.online"
        metric: 'restarts = {{ $value | printf "%.0f" }}'
        runbook: "docs/R-restart-loop"

    - alert: ContainerHighMemory
      expr: |
        container_memory_working_set_bytes{name=~".+"}
        / on(name) group_left
        container_spec_memory_limit_bytes{name=~".+"}
        > 0.9
        and on(name) container_spec_memory_limit_bytes{name=~".+"} > 0
      for: 5m
      labels:
        severity: P2
      annotations:
        summary: "{{ $labels.name }} · RAM >90% лимита"
        host: "node-01.msp-claude.online"
        metric: 'RAM usage = {{ $value | printf "%.0f" }}%'
        runbook: "docs/R-container-mem"
