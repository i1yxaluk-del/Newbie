---
# loki-config.yml — Конфигурация Grafana Loki
# Файл: /opt/monitoring/loki/loki-config.yml
# Версия: Loki 3.x, Single-binary mode (для <15 клиентов)

auth_enabled: false  # В production с несколькими tenant: true + tenant_id в Promtail

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  http_server_read_timeout:  60s
  http_server_write_timeout: 60s
  grpc_server_max_recv_msg_size: 33554432   # 32MB
  grpc_server_max_send_msg_size: 33554432

# ── Common хранилище ──────────────────────────────────────────────
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory:  /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# ── Query кэш ─────────────────────────────────────────────────────
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 256
  cache_results: true

# ── Схема хранения (v13 — актуальна для Loki 3.x) ────────────────
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# ── Хранилище ─────────────────────────────────────────────────────
storage_config:
  filesystem:
    directory: /loki/storage
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h

# ── Лимиты (глобальные дефолты) ───────────────────────────────────
limits_config:
  # Retention логов
  retention_period: 720h            # 30 дней по умолчанию

  # Rate limits (на один tenant)
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  per_stream_rate_limit: 32MB
  per_stream_rate_limit_burst: 64MB

  # Запросы
  max_query_length: 721h
  max_query_parallelism: 16
  max_entries_limit_per_query: 10000
  max_streams_per_user: 0           # 0 = без лимита

  # Метки
  max_label_names_per_series: 30
  max_label_value_length: 4096

  # Разрешить structural metadata
  allow_structured_metadata: true

  # Retention по тенантам (Silver: 30д, Gold: 90д)
  # Переопределяется в per-tenant конфигурации:
  # /loki/rules/CLIENT_SLUG/

# ── Compactor (очистка старых логов) ──────────────────────────────
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 10
  delete_request_store: filesystem

# ── Ruler (алерты на основе логов) ───────────────────────────────
ruler:
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  rule_path: /loki/rules-temp
  storage:
    type: local
    local:
      directory: /loki/rules

# ── Ingester (запись потоков) ──────────────────────────────────────
ingester:
  chunk_idle_period: 3m
  chunk_block_size: 262144
  chunk_retain_period: 1m
  max_transfer_retries: 0
  wal:
    dir: /loki/wal
    enabled: true
    checkpoint_duration: 5m

# ── Chunk store ────────────────────────────────────────────────────
chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 256
