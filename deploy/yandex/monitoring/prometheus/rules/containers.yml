groups:
- name: containers
  rules:
    - alert: ContainerDown
      expr: |
        absent(container_last_seen{name=~".+"})
        or
        time() - container_last_seen{name=~".+"} > 120
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "Контейнер {{ $labels.name }} не виден более 2 минут"

    - alert: ContainerRestartLoop
      expr: |
        increase(container_start_time_seconds{name=~".+"}[15m]) > 2
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "Контейнер {{ $labels.name }} перезапускался более 2 раз за 15 минут"

    - alert: ContainerHighMemory
      expr: |
        container_memory_working_set_bytes{name=~".+"}
        / on(name) group_left
        container_spec_memory_limit_bytes{name=~".+"}
        > 0.9
        and on(name) container_spec_memory_limit_bytes{name=~".+"} > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Контейнер {{ $labels.name }} использует >90% лимита памяти"
