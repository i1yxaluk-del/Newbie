global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.yandex.ru:587"
  smtp_from: "alerts@mspshield.ru"
  smtp_auth_username: "alerts@mspshield.ru"
  smtp_auth_password_file: /etc/alertmanager/smtp_password

route:
  receiver: telegram
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 1h
  routes:
    - match:
        severity: P1
      receiver: telegram_p1
      continue: true
    - match_re:
        severity: P2|P3
      receiver: telegram

receivers:
  - name: telegram
    telegram_configs:
      - api_url: https://api.telegram.org
        bot_token_file: /etc/alertmanager/tg_bot_token
        chat_id: 0  # replaced per-client via relabel or override
        parse_mode: HTML

  - name: telegram_p1
    telegram_configs:
      - api_url: https://api.telegram.org
        bot_token_file: /etc/alertmanager/tg_bot_token
        chat_id: 0
        parse_mode: HTML
        send_resolved: true
