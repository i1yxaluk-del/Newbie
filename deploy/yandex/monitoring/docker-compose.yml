# ═══════════════════════════════════════════════════════════════════
# MSPShield — Стек мониторинга (Prometheus + Grafana + Alertmanager)
# ═══════════════════════════════════════════════════════════════════
#
# КУДА: /opt/msp-monitoring/docker-compose.yml на ВМ
# ЗАПУСК: cd /opt/msp-monitoring && docker compose up -d
#
# Сеть: msp-monitoring (172.20.0.0/24) — изолирована от msp_default
# Порты: все привязаны к 127.0.0.1 — доступны ТОЛЬКО через SSH-туннель:
#   ssh -L 3000:127.0.0.1:3000 -L 9090:127.0.0.1:9090 \
#       -L 9093:127.0.0.1:9093 ubuntu@<IP>
#
# Дашборд: MSPShield Overview — палитра сайта (#1b4d3e лесной зелёный,
#   #5fc9a2 мятный акцент, #0e0c0a тёмный фон, #b45309 амбер)
#
# ВАЖНО (уроки из деплоя):
#   - cAdvisor требует /var/lib/docker/ → /rootfs/var/lib/docker (не
#     /var/lib/docker как в документации!). Иначе не видит контейнеры:
#     "Failed to create existing container... open /rootfs/var/lib/docker/
#     image/overlayfs/layerdb/mounts/...: no such file or directory"
#   - cAdvisor --disable_metrics с длинным списком флагов ломает запуск
#     (печатает help и exit). Оставляем минимум: percpu,sched,tcp,udp
#   - Grafana пароль задаётся в .env (GRAFANA_ADMIN_PASSWORD)
# ═══════════════════════════════════════════════════════════════════

name: msp-monitoring

networks:
  monitoring:
    name: msp-monitoring
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  msp_default:
    name: msp_default
    external: true

volumes:
  prometheus_data:
    name: msp-prometheus-data
  grafana_data:
    name: msp-grafana-data
  alertmanager_data:
    name: msp-alertmanager-data

services:

  # ── Prometheus — сбор и хранение метрик ────────────────────────
  # Scraping: сам себя, node-exporter, cadvisor, backend /metrics,
  # blackbox (HTTP/SMTP пробы). Алёрты → Alertmanager :9093.
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: msp-prometheus
    restart: unless-stopped
    user: "65534:65534"
    networks:
      monitoring:
        ipv4_address: 172.20.0.10
      msp_default:
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=4GB"
      - "--storage.tsdb.wal-compression"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      - "--web.external-url=http://127.0.0.1:9090"
      - "--query.timeout=60s"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:   { memory: 1G }
        reservations: { memory: 256M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Alertmanager — маршрутизация алёртов ───────────────────────
  # Получает алёрты от Prometheus, отправляет в backend webhook
  # (POST /api/alerts/alertmanager), который fan-out в MAX/Telegram.
  # Bearer-токен = ALERTMANAGER_WEBHOOK_TOKEN из backend/.env.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: msp-alertmanager
    restart: unless-stopped
    volumes:
      - alertmanager_data:/alertmanager
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://127.0.0.1:9093"
      # Отключаем cluster-режим (один инстанс, не HA)
      - "--cluster.listen-address="
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      monitoring:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:   { memory: 256M }
        reservations: { memory: 64M }
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ── Grafana — визуализация метрик ──────────────────────────────
  # Дашборд "MSPShield Overview" в палитре сайта.
  # Доступен ТОЛЬКО через SSH-туннель (127.0.0.1:3000).
  grafana:
    image: grafana/grafana:10.4.2
    container_name: msp-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "http://127.0.0.1:3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # Алёрты Grafana отключены — используем Alertmanager
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ALERTING_ENABLED: "false"
      # Тёмная тема по умолчанию (как на сайте msp-claude.online)
      GF_DEFAULT_THEME: "dark"
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-piechart-panel"
      GF_LOG_LEVEL: "warn"
      # ── Палитра MSPShield (используется в дашборде) ───────────
      # Лесной зелёный #1b4d3e — основной бренд, UP-статусы
      # Мятный акцент #5fc9a2 — графики на тёмном фоне
      # Тёмный фон #0e0c0a — как секции Pricing/CTA на сайте
      # Амбер #b45309 — предупреждения, disk usage
      # Красный #a13030 — ошибки, DOWN-статусы
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      monitoring:
        ipv4_address: 172.20.0.12
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:   { memory: 512M }
        reservations: { memory: 128M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Node Exporter — метрики ОС (CPU, RAM, disk, network) ──────
  # pid: host — чтобы видеть PID хоста, а не контейнера
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: msp-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      # Исключаем виртуальные ФС из отчёта disk
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--no-collector.ipvs"
    networks: [monitoring]
    deploy:
      resources:
        limits:   { memory: 128M }
        reservations: { memory: 32M }

  # ── cAdvisor — метрики Docker-контейнеров ────────────────────
  # ВАЖНО (уроки из деплоя):
  #   1. /var/lib/docker/ → /rootfs/var/lib/docker (НЕ /var/lib/docker!)
  #      cAdvisor ищет Docker layerdb по пути
  #      /rootfs/var/lib/docker/image/overlayfs/layerdb/mounts/...
  #   2. НО Docker 29+ с overlayfs driver НЕ создаёт layerdb/mounts/ —
  #      структура хранения изменилась. Поэтому ОБЯЗАТЕЛЬНО монтировать
  #      docker.sock — cAdvisor будет читать метрики через Docker API,
  #      а не через filesystem layerdb.
  #   3. Версия v0.49.1 НЕ поддерживает overlayfs driver из Docker 29+.
  #      Обновлено до v0.51.0 — поддерживает новый overlayfs storage.
  #   4. --disable_metrics с длинным списком флагов ломает запуск
  #      (cAdvisor печатает help и exit). Оставляем минимум.
  #   5. --docker_only=true — не собирать метрики systemd slice.
  #   6. privileged: true + docker.sock — cAdvisor должен иметь
  #      доступ к Docker API для чтения container stats.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: msp-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/rootfs/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev/disk:/dev/disk:ro
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--docker_env_metadata_whitelist="
      - "--disable_metrics=percpu,sched,tcp,udp"
    networks: [monitoring]
    deploy:
      resources:
        limits:   { memory: 256M }
        reservations: { memory: 64M }

  # ── Blackbox Exporter — HTTP/DNS/SMTP пробы сайтов ────────────
  # Prometheus использует blackbox для проверки доступности
  # сайта (HTTP 200, SSL, SMTP порты) через relabel_configs.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: msp-blackbox
    restart: unless-stopped
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    ports:
      - "127.0.0.1:9115:9115"
    networks: [monitoring]
    deploy:
      resources:
        limits:   { memory: 64M }
        reservations: { memory: 16M }
