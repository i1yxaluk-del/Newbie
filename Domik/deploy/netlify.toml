[build]
  base    = "Domik/frontend"
  publish = "Domik/frontend/dist"
  command = "npm install && npm run build"

[[redirects]]
  from = "/api/*"
  to   = "https://REPLACE-WITH-BACKEND.onrender.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
