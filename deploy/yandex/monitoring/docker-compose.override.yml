# Локальные production-инварианты. Compose автоматически объединяет этот файл с docker-compose.yml.
# Секреты берутся только из ignored monitoring/.env; реальные значения в Git запрещены.
services:
  alertmanager:
    environment:
      SMTP_AUTH_USER: "${SMTP_AUTH_USER:?SMTP_AUTH_USER обязателен для Postbox}"
      SMTP_AUTH_PASSWORD: "${SMTP_AUTH_PASSWORD:?SMTP_AUTH_PASSWORD обязателен для Postbox}"
      ALERTMANAGER_WEBHOOK_TOKEN: "${ALERTMANAGER_WEBHOOK_TOKEN:?ALERTMANAGER_WEBHOOK_TOKEN обязателен}"

  max-alerter:
    environment:
      MAX_PHONE: "${MAX_PHONE:?MAX_PHONE обязателен для ручной авторизации MAX}"
      MAX_CHAT_ID: "${MAX_CHAT_ID:?MAX_CHAT_ID обязателен для доставки MAX}"
      WEBHOOK_TOKEN: "${ALERTMANAGER_WEBHOOK_TOKEN:?ALERTMANAGER_WEBHOOK_TOKEN обязателен}"
      MAX_SESSION_DIR: "/session"
      MAX_SESSION_NAME: "max.db"
      TG_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TG_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
