<!--
  ═══════════════════════════════════════════════════════════════════
  wazuh_manager_ossec.conf — Конфигурация Wazuh Manager
  Файл: /var/ossec/etc/ossec.conf (внутри контейнера wazuh-manager)
  
  Применить: docker cp wazuh_manager_ossec.conf wazuh-manager:/var/ossec/etc/ossec.conf
             docker exec wazuh-manager /var/ossec/bin/wazuh-control restart
  ═══════════════════════════════════════════════════════════════════
-->
<ossec_config>

  <!-- ══════════════════════════════════════════════════════════
       GLOBAL SETTINGS
  ══════════════════════════════════════════════════════════ -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>smtp.example.wazuh.com</smtp_server>
    <email_from>wazuh@example.wazuh.com</email_from>
    <email_to>recipient@example.wazuh.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <!-- ══════════════════════════════════════════════════════════
       ALERTS — уровни
  ══════════════════════════════════════════════════════════ -->
  <alerts>
    <log_alert_level>3</log_alert_level>   <!-- Логировать от уровня 3 -->
    <email_alert_level>12</email_alert_level> <!-- Email от уровня 12 -->
  </alerts>

  <!-- ══════════════════════════════════════════════════════════
       REMOTE — приём от агентов
  ══════════════════════════════════════════════════════════ -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- ══════════════════════════════════════════════════════════
       AUTHD — автоматическая регистрация агентов
  ══════════════════════════════════════════════════════════ -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>no</use_password>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>

  <!-- ══════════════════════════════════════════════════════════
       CLUSTER (single-node)
  ══════════════════════════════════════════════════════════ -->
  <cluster>
    <name>wazuh</name>
    <node_name>master-node</node_name>
    <node_type>master</node_type>
    <key>7d1f8e2b3c4a5d6e7f8a9b0c1d2e3f4g</key>  <!-- Сменить! -->
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>localhost</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>  <!-- Включить при multi-node -->
  </cluster>

  <!-- ══════════════════════════════════════════════════════════
       SYSCHECK — глобальные настройки FIM
  ══════════════════════════════════════════════════════════ -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

    <!-- Linux: критичные файлы -->
    <directories check_all="yes">/etc</directories>
    <directories check_all="yes">/usr/bin</directories>
    <directories check_all="yes">/usr/sbin</directories>
    <directories check_all="yes">/bin</directories>
    <directories check_all="yes">/sbin</directories>

    <!-- Исключения -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore type="sregex">.log$</ignore>
    <ignore type="sregex">.swp$</ignore>
    <ignore type="sregex">.tmp$</ignore>
  </syscheck>

  <!-- ══════════════════════════════════════════════════════════
       ROOTCHECK
  ══════════════════════════════════════════════════════════ -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
  </rootcheck>

  <!-- ══════════════════════════════════════════════════════════
       VULNERABILITY DETECTOR
  ══════════════════════════════════════════════════════════ -->
  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>5m</interval>
    <min_full_scan_interval>6h</min_full_scan_interval>
    <run_on_start>yes</run_on_start>

    <!-- Ubuntu -->
    <provider name="canonical">
      <enabled>yes</enabled>
      <os>focal</os>
      <os>jammy</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- Debian -->
    <provider name="debian">
      <enabled>yes</enabled>
      <os>bullseye</os>
      <os>bookworm</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- Windows -->
    <provider name="msu">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>

    <!-- NVD (National Vulnerability Database) -->
    <provider name="nvd">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

  <!-- ══════════════════════════════════════════════════════════
       ACTIVE RESPONSE — автоматические реакции
  ══════════════════════════════════════════════════════════ -->
  <!-- Блокировать IP при >10 неудачных входах за 2 минуты -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5712</rules_id>  <!-- SSH brute force -->
    <timeout>3600</timeout>    <!-- Блокировать на 1 час -->
  </active-response>

  <!-- ══════════════════════════════════════════════════════════
       ИНТЕГРАЦИИ
  ══════════════════════════════════════════════════════════ -->
  <!-- Telegram алерты (высокий уровень) -->
  <integration>
    <name>custom-telegram</name>
    <hook_url>https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage</hook_url>
    <level>10</level>  <!-- Только level 10+ -->
    <alert_format>json</alert_format>
  </integration>

  <!-- ══════════════════════════════════════════════════════════
       LOCALFILES — сбор логов Manager
  ══════════════════════════════════════════════════════════ -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- ══════════════════════════════════════════════════════════
       INDEXER — Wazuh Indexer (OpenSearch)
  ══════════════════════════════════════════════════════════ -->
  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://wazuh.indexer:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/ssl/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/ssl/filebeat.pem</certificate>
      <key>/etc/ssl/filebeat.key</key>
    </ssl>
  </indexer>

</ossec_config>
