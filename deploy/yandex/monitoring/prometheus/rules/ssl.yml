groups:
  - name: ssl
    rules:
      - alert: SSLExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: P2
        annotations:
          summary: "{{ $labels.instance }} · SSL-сертификат истекает менее чем через 14 дней"
          host: "node-01.msp-claude.online"
          metric: 'days_left = {{ $value | printf "%.0f" }}'
          runbook: "ssl/expiring"

      - alert: SSLExpired
        expr: (probe_ssl_earliest_cert_expiry - time()) < 0
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "{{ $labels.instance }} · SSL-сертификат ИСТЁК"
          host: "node-01.msp-claude.online"
          metric: 'days_left = {{ $value | printf "%.0f" }}'
          runbook: "ssl/expired"
