# Prometheus scrape config · MSPShield
# Runs on mspshield-landing (or dedicated monitoring VM).
# Targets are pulled through WireGuard overlay (10.20.x.x).

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: prod
    msp: mspshield

rule_files:
  - rules/common.yml
  - rules/backups.yml
  - rules/ssl.yml
  - rules/ad.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: self
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    file_sd_configs:
      - files: ["targets/node/*.yml"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "(.+):9100"
        target_label: instance

  - job_name: mspshield-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8001"]

  - job_name: wireguard
    static_configs:
      - targets: ["10.10.0.1:9586"]

  # Per-tenant file_sd — populated by Ansible from inventory.
  - job_name: tenant-nodes
    file_sd_configs:
      - files: ["targets/tenants/*.yml"]
