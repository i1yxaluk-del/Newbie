---
# ═══════════════════════════════════════════════════════════════════
# Grafana — Dashboard Provisioning Provider
# ═══════════════════════════════════════════════════════════════════
# Автоматически загружает все *.json дашборды из /var/lib/grafana/dashboards
# при старте контейнера. Каталог монтируется из ./grafana/dashboards.
# ═══════════════════════════════════════════════════════════════════

apiVersion: 1

providers:
- name: 'MSPShield'
  orgId: 1
  folder: 'MSPShield'
  folderUid: 'mspshield'
  type: file
  disableDeletion: false
  updateIntervalSeconds: 30
  allowUiUpdates: true
  options:
    path: /var/lib/grafana/dashboards
    foldersFromFilesStructure: false
