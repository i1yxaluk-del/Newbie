# ─────────────────────────────────────────────────────────────
# MSPShield · nginx reverse proxy (landing + /api + /metrics)
# ─────────────────────────────────────────────────────────────
# RU: Разворачивается на landing-VM (mspshield-landing). Принимает
# HTTPS-трафик на 80/443 и маршрутизирует:
#   /            → статика React (собранный build)
#   /api/*       → FastAPI backend (127.0.0.1:8001)
#   /metrics     → тот же backend, но доступ ограничен по IP
#   /.well-known → certbot HTTP-01 challenge (для обновления TLS)
# Сертификаты выпускаются certbot'ом (Let's Encrypt), ключи лежат в
# /etc/letsencrypt/live/msp-claude.online/fullchain.pem + privkey.pem.
# Frontend (React static build) берётся из /var/www/mspshield.
# Backend FastAPI слушает 127.0.0.1:8001 (не пускаем снаружи).
# Первый слой rate-limit'а настроен здесь (limit_req_zone ниже);
# второй слой — в backend/server.py (per-IP bucket).
# ─────────────────────────────────────────────────────────────

# Per-IP rate zones (backend also enforces its own limit; nginx is first layer)
limit_req_zone $binary_remote_addr zone=leads:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name msp-claude.online www.msp-claude.online;

    # certbot HTTP-01 challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name msp-claude.online www.msp-claude.online;

    ssl_certificate     /etc/letsencrypt/live/msp-claude.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/msp-claude.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # CSP kept permissive for SmartCaptcha iframe + Yandex Metrika
    add_header Content-Security-Policy "default-src 'self'; \
script-src 'self' 'unsafe-inline' 'unsafe-eval' https://smartcaptcha.yandexcloud.net https://mc.yandex.ru; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' data: https://fonts.gstatic.com; \
img-src 'self' data: https: blob:; \
connect-src 'self' https://mc.yandex.ru https://smartcaptcha.yandexcloud.net; \
frame-src https://smartcaptcha.yandexcloud.net https://mc.yandex.ru;" always;

    client_max_body_size 2M;
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json
               text/xml application/xml image/svg+xml font/woff font/woff2;

    # Frontend static
    root /var/www/mspshield;
    index index.html;

    # Long-cache for hashed CRA static assets (filenames have content hash).
    location /static/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static docs (privacy/offer/sla)
    location /docs/ {
        try_files $uri $uri/ =404;
    }

    # SPA fallback. index.html сам не кэшируем, чтобы релизы доезжали мгновенно.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }

    # ── API ──
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # POST lead-submission — stricter
    location = /api/leads {
        limit_req zone=leads burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus /metrics — only from internal subnet
    location = /metrics {
        allow 10.9.0.0/24;     # bastion overlay
        deny all;
        proxy_pass http://127.0.0.1:8001/metrics;
    }
}
