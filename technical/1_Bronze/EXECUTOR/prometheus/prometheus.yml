---
# ═══════════════════════════════════════════════════════════════════
# prometheus.yml — Основная конфигурация сбора метрик
# Файл: /opt/monitoring/prometheus/prometheus.yml
#
# ДЛЯ JUNIOR:
#   Prometheus работает по модели PULL:
#   сам опрашивает (scrape) экспортеры на клиентах по расписанию.
#   Клиенты НЕ отправляют данные — Prometheus сам забирает.
#
#   Ключевые понятия:
#   - scrape_interval — как часто опрашивать (по умолчанию)
#   - job_name       — группа targets (один тип мониторинга)
#   - labels         — метки для фильтрации в Grafana/алертах
#   - metric_relabel_configs — фильтрация/переименование метрик
#
# Команды управления:
#   Проверить конфиг:  promtool check config prometheus.yml
#   Reload без рестарта: curl -X POST http://localhost:9090/-/reload
#   Статус targets:    http://10.9.0.1:9090/targets
# ═══════════════════════════════════════════════════════════════════

global:
  scrape_interval:     15s    # Как часто опрашивать targets
  evaluation_interval: 15s    # Как часто вычислять alert rules
  scrape_timeout:      10s    # Таймаут одного scrape-запроса

  # Метки на всех метриках этого Prometheus
  external_labels:
    region:       'ru-central1'
    msp_instance: 'primary'

# ── Alertmanager ────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout:     10s
      api_version: v2

# ── Файлы с правилами алертов ───────────────────────────────────────
rule_files:
  - "/etc/prometheus/rules/*.yml"

# ── Scrape configs ──────────────────────────────────────────────────
scrape_configs:

  # ══════════════════════════════════════════════════════════════════
  # ИНФРАСТРУКТУРА ИСПОЛНИТЕЛЯ
  # ══════════════════════════════════════════════════════════════════

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          role:     'monitoring'
          owner:    'executor'
          instance: 'prometheus'

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          role:  'monitoring'
          owner: 'executor'

  - job_name: 'grafana'
    scrape_interval: 60s
    static_configs:
      - targets: ['grafana:3000']
        labels:
          role:  'monitoring'
          owner: 'executor'

  - job_name: 'node-exporter-msp-vm'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          role:     'monitoring-host'
          owner:    'executor'
          instance: 'msp-monitoring-vm'

  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          role:  'docker'
          owner: 'executor'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_tasks_state|container_memory_failures_total'
        action: drop

  - job_name: 'blackbox-exporter'
    scrape_interval: 60s
    static_configs:
      - targets: ['blackbox-exporter:9115']
        labels:
          role:  'monitoring'
          owner: 'executor'

