---
# ──────────────────────────────────────────────────────────────
# patch_disruptive.yml · полное обновление С РЕБУТОМ при необходимости
# ──────────────────────────────────────────────────────────────
# RU: Запускается ТОЛЬКО в согласованное с клиентом patch-window
# (обычно вс. ночью, см. клиентский SLA). Обновляет всё, перезагружает
# хост если нужно, и проверяет критичные сервисы после загрузки.
#
# Переменные:
#   client          — группа хостов (обязательно; не запускать на tenants без ограничения).
#   batch_size      — сколько хостов одновременно (по умолчанию 1).
#   critical_services — список systemd unit'ов для post-reboot health-check.
#
# Пример безопасного запуска для одного тенанта:
#   ansible-playbook playbooks/patch_disruptive.yml \
#     -e client=acme -e '{"critical_services":["sshd","nginx","postgresql"]}'
# ──────────────────────────────────────────────────────────────
- hosts: "{{ client | default('tenants') }}"
  become: true
  serial: "{{ batch_size | default(1) }}"
  max_fail_percentage: 0
  tasks:
    - name: apt full-upgrade
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        autoremove: true
      when: ansible_os_family == "Debian"

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required
      ansible.builtin.reboot:
        msg: "MSP patch window — scheduled reboot"
        reboot_timeout: 600
      when: reboot_required.stat.exists

    - name: Health-check after reboot — critical systemd units
      ansible.builtin.shell: >
        systemctl is-active {{ item }}
      loop: "{{ critical_services | default(['sshd']) }}"
      register: svc_status
      failed_when: svc_status.stdout != "active"
      changed_when: false
