name: Import curated MSPShield book

on:
  push:
    branches:
      - docs/curate-book-video-stack
    paths:
      - .github/workflows/import-curated-book.yml

permissions:
  contents: write

jobs:
  import-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/curate-book-video-stack

      - name: Download and verify archive
        env:
          ARCHIVE_URL: 'https://prod-files-secure-apne1.s3.ap-northeast-1.amazonaws.com/58aa5f3f-d1c2-81d3-85bd-000368aa0c95/cfb567f9-7e1f-4234-95eb-7f00a0c03c57/MSPShield_Academy_MD_curated.zip?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=ASIAZI2LB466USLLUTT4%2F20260929%2Fap-northeast-1%2Fs3%2Faws4_request&X-Amz-Date=20260929T062426Z&X-Amz-Expires=3600&X-Amz-Security-Token=IQoJb3JpZ2luX2VjEHwaDmFwLW5vcnRoZWFzdC0xIkcwRQIhAK41724YJdh%2Fg%2B20H1kEluJWOwgihyOshcmVGGR7a8pjAiBJeoBv55B%2FXFVq19%2BjADRNT8xUEwwdqXa5dwDcJ9b5iyqGBAhGEAAaDDYzNzQyMzE4MzgwNSIMYLhojFgt76jhhMhsKuMDlCBj4mVAwH2ZcGsRjcGg2C1A%2Ff%2Fkkh0FQv5L9STHm7T3eEB0BWXzz66fIxJBdHmbADa%2BRox4z46o075lzkWGaU81y7TZaecwXl1mHghYnNxmJ6cSVkh0mcQDSo6o87LGsumgsFkizHvDjJy8U8QaPs8GTWVBMsja0JD5Kk9xJ4x2hX0MjMkOkGHaeT73KBLdu2lIyyjYUfSjHgMFIykDq%2BYyLabgNyGyTD2nxyNlW7rui%2FyyCmrP25EaUjoBXHk2WERnnL24PbcaFb9IsWs5jppCn8IHXkvkGmf%2BlEiH2nVBpHvp3W6ANXQFUFunR8aCQGz%2B2g0scCP8DSDTHk6emlAa6msFq1L4qdmmoArHWP4cuB0p%2FunCRnuw44unvXms9E7pFGnuBXZjETMBQjuSpd%2B6cL4rwpchzg%2FFANwu2BQtgytcft3GvmbsmNTo1%2BjsZ9%2B0tvkLT7W1IXoOwp5QR8KGXwWZ%2B9bej1vg7tV81Wbnv%2FMtJnHgkWIgIWmi6MhTUnbznmpZ%2BTIU1fSTX%2BN2AndK3j3AtkYfBW1TOYupP9%2BNcYND3TC58%2Bc2YqKbXlpl8y09rm4uwcUvgtj8k4pl%2FdJPwFdgdnRvO9OwrSNVPp8yGA7WohpoE3pcaqmtK4jlGd1UMM2A7dUGOqUBy7v0FqcPa%2BpsnbdZMcrVT0KPJSBaB1dkvMyzK6FKP6I10nq%2Fuf8x4X36%2F6jIcMQw%2BzRzehJre%2BCDR%2FkSU%2FfJC1YdTugSQNcBJwVJOswCvh0GHvAfjSzqMvc65PBU0Ar21yLmnVfpKfjMUR2wkcNoWFhRUQ4DgnLBVQbg0wu9gW345JdqmTStTenRMIL7hOJTDzM%2Fh4Bh0OLj493Ur4zSolBYJms0&X-Amz-Signature=e60ec6e83e533ef0d44264ee9127289d09be1c0aa53aa25cda234d2089dd662b&X-Amz-SignedHeaders=host&x-amz-checksum-mode=ENABLED&x-id=GetObject'
        run: |
          set -Eeuo pipefail
          curl -fsSL "$ARCHIVE_URL" -o /tmp/book.zip
          unzip -t /tmp/book.zip
          rm -rf /tmp/book-import
          mkdir -p /tmp/book-import
          unzip -q /tmp/book.zip -d /tmp/book-import
          test -f /tmp/book-import/MSPShield_Academy_MD/BOOK.md
          test -f /tmp/book-import/MSPShield_Academy_MD/VIDEO_GUIDE.md
          test -f /tmp/book-import/MSPShield_Academy_MD/guides/GITHUB_OWNER_WORKFLOW.md
          test -f /tmp/book-import/MSPShield_Academy_MD/guides/YANDEX_CLOUD_OWNER.md
          test -f /tmp/book-import/MSPShield_Academy_MD/guides/KAITEN_OPERATIONS.md
          test -f /tmp/book-import/MSPShield_Academy_MD/guides/SALES_STACK.md
          test "$(find /tmp/book-import/MSPShield_Academy_MD/chapters -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 38
          ! grep -R "youtube.com/results?search_query" /tmp/book-import/MSPShield_Academy_MD

      - name: Replace book and commit
        run: |
          set -Eeuo pipefail
          rm -rf book
          mkdir -p book
          cp -a /tmp/book-import/MSPShield_Academy_MD/. book/
          rm -f .github/workflows/import-curated-book.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(book): обновить README, видео и руководства по стеку [skip ci]"
          git push origin HEAD:docs/curate-book-video-stack
