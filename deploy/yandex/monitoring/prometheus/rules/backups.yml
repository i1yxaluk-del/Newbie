# ═══════════════════════════════════════════════════════════════════
# backups.yml — Prometheus alerting rules для restic-бэкапов
# ═══════════════════════════════════════════════════════════════════
#
# Метрики из restic-metrics.sh (node-exporter textfile collector):
#   - restic_backup_success{host,repo}            — 1=ok, 0=fail
#   - restic_backup_timestamp_seconds{host,repo}
#   - restic_backup_size_bytes{host,repo}
#   - restic_verify_success{host,repo}
#   - restic_verify_timestamp_seconds{host,repo}
#   - restic_restore_test_success{host,repo}
#   - restic_restore_test_timestamp_seconds{host,repo}
# ═══════════════════════════════════════════════════════════════════

groups:
- name: backups
  interval: 1m
  rules:

    # ── Бэкап упал ─────────────────────────────────────────────
    - alert: BackupFailed
      expr: restic_backup_success == 0
      for: 5m
      labels:
        severity: critical
        team: ops
      annotations:
        summary: "Бэкап {{ $labels.host }}/{{ $labels.repo }} упал"
        description: "restic backup для {{ $labels.host }} вернул exit_code != 0. Лог: /var/log/restic/{{ $labels.host }}-{{ $labels.repo }}.log"
        runbook: "https://github.com/i1yxaluk-del/Newbie/blob/main/deploy/yandex/monitoring/restic-exporter/README.md#backup-failed"

    # ── Бэкап не запускался > 26 часов ─────────────────────────
    # (cron ставится на 24h, +2h на завершение)
    - alert: BackupMissed24h
      expr: (time() - restic_backup_timestamp_seconds) > 93600
      for: 10m
      labels:
        severity: critical
        team: ops
      annotations:
        summary: "Бэкап {{ $labels.host }}/{{ $labels.repo }} не запускался > 26ч"
        description: "Последний backup был {{ $value | humanizeDuration }} назад. Проверь cron на ВМ."

    # ── Verify не проходил > 7 дней ────────────────────────────
    - alert: VerifyStale
      expr: (time() - restic_verify_timestamp_seconds) > 604800
      for: 30m
      labels:
        severity: warning
        team: ops
      annotations:
        summary: "restic check {{ $labels.host }} не запускался > 7 дней"
        description: "Verify последний раз был {{ $value | humanizeDuration }} назад. Запусти: restic check --read-data-subset=5%"

    # ── Restore-test (R-11 DR drill) не проходил > 30 дней ────
    - alert: RestoreTestStale
      expr: (time() - restic_restore_test_timestamp_seconds) > 2592000
      for: 1h
      labels:
        severity: warning
        team: ops
      annotations:
        summary: "DR drill (R-11) не выполнялся > 30 дней"
        description: "Последний restore-test был {{ $value | humanizeDuration }} назад. По SLA нужен раз в месяц."

    # ── Restore-test упал ─────────────────────────────────────
    - alert: RestoreTestFailed
      expr: restic_restore_test_success == 0
      for: 5m
      labels:
        severity: critical
        team: ops
      annotations:
        summary: "Restore-test {{ $labels.host }} провалился"
        description: "Бэкап есть, но восстановление не работает. КРИТИЧНО — нужно вмешательство ops."

    # ── Размер бэкапа резко упал (> 50% drop) ──────────────────
    # Сигнал что бэкап неполный (например, пропал mount)
    - alert: BackupSizeDropped
      expr: |
        (
          restic_backup_size_bytes
          / on(host, repo) (avg_over_time(restic_backup_size_bytes[7d] offset 1d))
        ) < 0.5
      for: 15m
      labels:
        severity: warning
        team: ops
      annotations:
        summary: "Размер бэкапа {{ $labels.host }} упал > 50%"
        description: "Текущий размер {{ $value | humanizePercentage }} от 7-дневного среднего. Возможно неполный backup."
