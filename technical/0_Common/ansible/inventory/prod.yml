---
# ──────────────────────────────────────────────────────────────
# Ansible inventory · prod
# ──────────────────────────────────────────────────────────────
# RU: Инвентарь production-окружения. Все подключения проходят через
# bastion (AmneziaWG-концентратор на UDP/443), ProxyJump настроен в ansible.cfg.
# BASTION_PUBLIC_IP — переменная окружения (выставляем из terraform output).
#
# Группы:
#   landing  — публичный лендинг (1 хост).
#   bastion  — AmneziaWG-хаб (1 хост, UDP/443).
#   tenants  — клиентские хосты, ПОДРАЗДЕЛЯЮТСЯ на отдельные группы
#              по клиенту (acme / example и т.д.) для удобства
#              --limit <client>.
#
# При добавлении нового клиента:
#   1. tenant_add.sh на bastion (получить peer-CIDR).
#   2. Дописать блок children: в секцию tenants ниже.
#   3. git commit — инвентарь версионирован.
# ──────────────────────────────────────────────────────────────

all:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3

  children:
    landing:
      hosts:
        mspshield-landing:
          ansible_host: 10.9.0.11
    bastion:
      hosts:
        mspshield-bastion:
          ansible_host: "{{ lookup('env', 'BASTION_PUBLIC_IP') }}"

    # Populated per tenant. Template:
    # tenants:
    #   children:
    #     acme:
    #       hosts:
    #         acme-dc01: { ansible_host: 10.20.10.11 }
    #         acme-fs01: { ansible_host: 10.20.10.12 }
    tenants:
      children: {}
