global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_HOST}:465"
  smtp_from: "${SMTP_FROM}"
  smtp_auth_username: "${SMTP_USER}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: msp-backend

  routes:
    - matchers:
        - severity =~ "critical|page|high|error"
      receiver: msp-backend
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h
      continue: true

    - matchers:
        - severity =~ "critical|page|high|error"
      receiver: email-alert
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h

    - matchers:
        - severity =~ "warning|warn"
      receiver: msp-backend
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 4h

receivers:
  - name: msp-backend
    webhook_configs:
      - url: 'https://msp-claude.online/api/alerts/alertmanager'
        send_resolved: true
        max_alerts: 0
        http_config:
          authorization:
            type: Bearer
            credentials: 'ALERTMANAGER_WEBHOOK_TOKEN_PLACEHOLDER'

  - name: email-alert
    email_configs:
      - to: "${SMTP_FROM}"
        send_resolved: true
        headers:
          Subject: "[MSPShield] {{ .GroupLabels.alertname }} - {{ .CommonAnnotations.summary }}"

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity =~ "warning|info"
    equal: ['alertname', 'instance']
