name: Apply book v3
on:
  push:
    branches: [book/full-readable-rewrite-v3]
permissions: {contents: write}
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: book/full-readable-rewrite-v3}
      - run: python .github/rewrite_book_v3.py
      - run: |
          python book/verify_readability.py
          python book/verify_readability.py --yandex
      - run: |
          rm .github/rewrite_book_v3.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(book): explain Yandex Cloud and audit every chapter'
          git push origin HEAD:book/full-readable-rewrite-v3
