# Production stack for the MSPShield pilot.
# Backend is reachable only through host Caddy. Monitoring must scrape
# backend:8001 over the shared Docker network, never through a public host port.
name: msp

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/yandex/Dockerfile.backend
    restart: unless-stopped
    env_file: ../../backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: mspshield
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      mongo:
        condition: service_healthy

  # Optional legacy mail server. Production outbound mail uses Yandex Cloud
  # Postbox directly. Start this profile only if inbound/IMAP is deliberately
  # required and its public ports have been reviewed:
  # docker compose --profile mail up -d stalwart
  stalwart:
    profiles: ["mail"]
    image: stalwartlabs/stalwart:v0.16
    restart: unless-stopped
    environment:
      STALWART_RECOVERY_ADMIN: "admin:${STALWART_ADMIN_PASSWORD:?set STALWART_ADMIN_PASSWORD}"
      STALWART_QUEUE_DEFAULT_ROUTE: postbox-outbound
      STALWART_ROUTES_POSTBOX_OUTBOUND_TYPE: relay
      STALWART_ROUTES_POSTBOX_OUTBOUND_ADDRESS: postbox.cloud.yandex.net
      STALWART_ROUTES_POSTBOX_OUTBOUND_PORT: "465"
      STALWART_ROUTES_POSTBOX_OUTBOUND_TLS_IMPLICIT: "true"
      STALWART_ROUTES_POSTBOX_OUTBOUND_AUTH_USERNAME: ${POSTBOX_API_KEY_ID:-}
      STALWART_ROUTES_POSTBOX_OUTBOUND_AUTH_SECRET: ${POSTBOX_API_KEY_SECRET:-}
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
      - /var/lib/caddy:/etc/stalwart-certs:ro
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "4190:4190"
      - "127.0.0.1:8080:8080"

  vaultwarden:
    image: vaultwarden/server:1.36.0
    restart: unless-stopped
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN:-https://vault.msp-claude.online}
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?set a unique Argon2 admin token}
      WEBSOCKET_ENABLED: "true"
      LOG_FILE: /data/vaultwarden.log
      LOG_LEVEL: warn
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURITY: ${SMTP_SECURITY:-force_tls}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH_MECHANISM: ${SMTP_AUTH_MECHANISM:-Plain}
    volumes:
      - vaultwarden-data:/data
    ports:
      - "127.0.0.1:8180:80"
      - "127.0.0.1:3012:3012"

volumes:
  mongo-data:
    driver: local
  stalwart-etc:
    driver: local
  stalwart-data:
    driver: local
  vaultwarden-data:
    driver: local
