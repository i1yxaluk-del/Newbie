# ═══════════════════════════════════════════════════════════════════
# awg-server-template.conf — Шаблон AmneziaWG SERVER (bastion / landing-VM)
# Размещение: /etc/amnezia/amneziawg/awg0.conf
# Источник: 0_Common/amneziawg/awg-server-template.conf
#
# ПОЧЕМУ AmneziaWG, а не WireGuard:
#   РКН-DPI ловит обычный WireGuard handshake по сигнатуре независимо
#   от порта. AmneziaWG = форк WireGuard с обфускацией handshake-пакетов
#   (junk-пакеты до handshake, рандомизированная длина init/response).
#   Полностью совместим с WireGuard семантически: те же ключи, те же
#   AllowedIPs, тот же netlink-интерфейс (prometheus-wireguard-exporter
#   читает его так же). Доп. поля: Jc/Jmin/Jmax/S1/S2/H1..H4.
#
# ЧТО ДЕЛАЕТ ЭТОТ КОНФИГ:
#   - AmneziaWG сервер слушает UDP **443** (не 51820!) — чтобы не открывать
#     ещё один публичный порт и не конфликтовать с Caddy TCP/443 (разные
#     протоколы → не конфликтуют).
#   - VPN-сеть: 10.9.0.0/24
#   - Bastion IP: 10.9.0.1
#   - NAT: AmneziaWG-клиенты могут ходить в интернет через хост (опционально)
#   - Peers добавляются при онбординге клиентов (tenant_add.sh)
#
# ПЕРЕД ЗАПУСКОМ:
#   1. Установить AmneziaWG (см. awg_bootstrap.sh — PPA ppa:amnezia/ppa):
#        sudo add-apt-repository ppa:amnezia/ppa
#        sudo apt-get install -y amneziawg-dkms amneziawg-tools
#   2. Сгенерировать ключи: awg genkey | tee server_private.key | awg pubkey > server_public.key
#   3. Заменить <SERVER_PRIVATE_KEY> на реальный приватный ключ
#   4. Включить IP forwarding: sysctl -w net.ipv4.ip_forward=1
#   5. systemctl enable --now awg-quick@awg0
#
# ВАЖНО про Jc/Jmin/Jmax/S1/S2/H1..H4:
#   Эти значения ДОЛЖНЫ совпадать на сервере и клиенте, иначе handshake
#   не пройдёт. Генерим ОДИН профиль для всего деплоя, шарим через
#   Vaultwarden как "MSPShield AmneziaWG profile". Не путать с ключами
#   peer'ов — те уникальные для каждого клиента, как в обычном WG.
# ═══════════════════════════════════════════════════════════════════

[Interface]
PrivateKey = <SERVER_PRIVATE_KEY>
Address    = 10.9.0.1/24
ListenPort = 443

# AmneziaWG обфускация — общий профиль на весь деплой
# (одинаковый на сервере и всех клиентах, генерируется один раз).
Jc   = 4
Jmin = 50
Jmax = 1000
S1   = 86
S2   = 574
H1   = 1779539752
H2   = 1138729192
H3   = 2050378563
H4   = 8345423

# NAT — позволяет VPN-клиентам ходить в интернет через bastion
# PostUp выполняется при запуске туннеля, PostDown — при остановке.
PostUp   = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

# ═══════════════════════════════════════════════════════════════════
# PEERS КЛИЕНТОВ — добавлять при онбординге
# Формат:
#   [Peer]
#   PublicKey = <CLIENT_PUBLIC_KEY>
#   AllowedIPs = <VPN_IP>/32
#
# Диапазоны IP для клиентов:
#   Клиент 1: 10.9.0.10–10.9.0.19
#   Клиент 2: 10.9.0.20–10.9.0.29
#   Клиент 3: 10.9.0.30–10.9.0.39
#   ...
#   Каждый клиент — блок по 10 IP
# ═══════════════════════════════════════════════════════════════════

# === Клиент: EXAMPLE_COMPANY (добавлен 2026-04-20) ===
# [Peer]
# PublicKey = <EXAMPLE_PUBLIC_KEY>
# AllowedIPs = 10.9.0.10/32
