# ═══════════════════════════════════════════════════════════════════
# alertmanager.yml — Общая конфигурация Alertmanager для всех тарифов
# Размещение: /opt/monitoring/alertmanager/alertmanager.yml
#             и в 0_Common/alertmanager/ как эталон
#
# ЧТО ДЕЛАЕТ:
#   - Маршрутизация алертов по severity и категории
#   - CRITICAL → Telegram + Email (немедленно)
#   - WARNING → Email (группировать по 5 мин)
#   - BACKUP → Telegram (отдельный канал)
#   - Ингибирование: если CRITICAL — подавлять WARNING от того же клиента
#
# ПЕРЕД ЗАПУСКОМ:
#   Заполнить: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SMTP_* в .env
# ═══════════════════════════════════════════════════════════════════

global:
  # SMTP для email-уведомлений (резервный канал)
  smtp_smarthost: "${SMTP_HOST:-smtp.yandex.ru:587}"
  smtp_from: "${SMTP_FROM:-alerts@your-domain.ru}"
  smtp_auth_username: "${SMTP_USER:-alerts@your-domain.ru}"
  smtp_auth_password: "${SMTP_PASSWORD:?SMTP_PASSWORD must be set in .env}"
  smtp_require_tls: true

# Шаблоны форматирования сообщений
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# Маршрутизация алертов
route:
  receiver: "telegram-critical"        # По умолчанию — в Telegram
  group_by: ["alertname", "client"]    # Группировать по имени алерта + клиент
  group_wait: 30s                      # Ждать 30с перед отправкой группы
  group_interval: 5m                   # Интервал между группами
  repeat_interval: 4h                  # Повторять неразрешённые алерты каждые 4ч

  routes:
    # ── CRITICAL алерты → Telegram + Email ──────────────────────────
    - match:
        severity: critical
      receiver: "telegram-critical"
      group_wait: 10s
      repeat_interval: 1h

    # ── WARNING алерты → Email только ───────────────────────────────
    - match:
        severity: warning
      receiver: "email-warning"
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 6h

    # ── Бэкап-алерты → Telegram (отдельная группа) ──────────────────
    - match:
        category: backup
      receiver: "telegram-backup"
      group_wait: 30s
      repeat_interval: 12h

    # ── SLA-алерты → Telegram CRITICAL ──────────────────────────────
    - match:
        category: sla
      receiver: "telegram-critical"
      group_wait: 0s
      repeat_interval: 30m

# Приёмники (receivers)
receivers:
  # ── Telegram: критичные алерты ────────────────────────────────────
  - name: "telegram-critical"
    webhook_configs:
      - url: "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
        send_resolved: true
    # Альтернатива: использовать custom integration script
    # См. SOP_executor_bronze.md §5

  # ── Telegram: бэкапы ──────────────────────────────────────────────
  - name: "telegram-backup"
    webhook_configs:
      - url: "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
        send_resolved: true

  # ── Email: warning алерты ─────────────────────────────────────────
  - name: "email-warning"
    email_configs:
      - to: "${ALERT_EMAIL_TO:-admin@your-domain.ru}"
        send_resolved: true
        headers:
          Subject: "[MSP WARNING] {{ .GroupLabels.alertname }}"

# Ингибирование — подавлять менее важные алерты
# если есть более важный от того же клиента
inhibit_rules:
  # Если CRITICAL — подавлять WARNING от того же клиента
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["client", "alertname"]

  # Если CRITICAL — подавлять INFO
  - source_match:
      severity: "critical"
    target_match:
      severity: "info"
    equal: ["client"]
