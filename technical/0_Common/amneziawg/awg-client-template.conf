# ═══════════════════════════════════════════════════════════════════
# awg-client-template.conf — Шаблон AmneziaWG КЛИЕНТА (Linux)
# Размещение: /etc/amnezia/amneziawg/awg0-msp.conf
# Источник: 0_Common/amneziawg/awg-client-template.conf
#
# ЧТО ДЕЛАЕТ ЭТОТ КОНФИГ:
#   - Подключается к AmneziaWG серверу Исполнителя на UDP 443
#   - Направляет трафик в VPN-сеть 10.9.0.0/24
#   - DNS: 77.88.8.8 (Yandex DNS) — рекомендуется для РФ
#   - PersistentKeepalive: держит туннель живым за NAT
#
# ВАЖНО: Jc/Jmin/Jmax/S1/S2/H1..H4 ДОЛЖНЫ ТОЧНО совпадать с сервером,
# иначе handshake не пройдёт. Значения передаёт Исполнитель вместе с
# остальной частью конфига (это общий профиль на весь деплой).
#
# ЗАПОЛНИТЬ ПЕРЕД УСТАНОВКОЙ:
#   1. <CLIENT_PRIVATE_KEY> — сгенерировать клиенту: awg genkey
#   2. <CLIENT_VPN_IP> — назначается Исполнителем (например 10.9.0.10)
#   3. <BASTION_PUBLIC_KEY> — публичный ключ Bastion (даёт Исполнитель)
#   4. <BASTION_PUBLIC_IP> — внешний IP Bastion (даёт Исполнитель)
# ═══════════════════════════════════════════════════════════════════

[Interface]
PrivateKey = <CLIENT_PRIVATE_KEY>
Address = <CLIENT_VPN_IP>/32     # Например: 10.9.0.10/32
DNS = 77.88.8.8, 77.88.8.1       # Yandex DNS — рекомендуется для РФ

# AmneziaWG обфускация — ОБЩИЙ профиль с сервером (выдаёт Исполнитель).
Jc   = 4
Jmin = 50
Jmax = 1000
S1   = 86
S2   = 574
H1   = 1779539752
H2   = 1138729192
H3   = 2050378563
H4   = 8345423

[Peer]
PublicKey = <BASTION_PUBLIC_KEY>
Endpoint = <BASTION_PUBLIC_IP>:443      # AmneziaWG слушает UDP 443
AllowedIPs = 10.9.0.0/24                # Только VPN-трафик (не весь интернет!)
PersistentKeepalive = 25                # Держать туннель живым за NAT

# ═══════════════════════════════════════════════════════════════════
# ПОСЛЕ СОЗДАНИЯ КОНФИГА:
#   chmod 600 /etc/amnezia/amneziawg/awg0-msp.conf   # Приватный ключ = секрет!
#   systemctl enable --now awg-quick@awg0-msp
#   ping 10.9.0.1                                    # Проверить связь с Bastion
# ═══════════════════════════════════════════════════════════════════
