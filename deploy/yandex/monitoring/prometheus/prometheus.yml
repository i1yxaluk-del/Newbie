global:
  scrape_interval: 60s
  evaluation_interval: 60s
  external_labels:
    environment: prod
    msp: mspshield

rule_files:
  - rules/common.yml
  - rules/ssl.yml
  - rules/site.yml
  - rules/containers.yml
  - rules/services.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    # Ограничиваем метрики cadvisor — берём только нужные, чтобы не грузить VM
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_(cpu_usage_seconds_total|memory_usage_bytes|memory_working_set_bytes|network_receive_bytes_total|network_transmit_bytes_total|start_time_seconds|last_seen|tasks_state)'
        action: keep
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: mspshield-backend
    metrics_path: /metrics
    static_configs:
      # Backend в сети msp_default, доступен по Docker DNS имени.
      # Prometheus подключён к сети msp_default через networks в compose.
      - targets: ["backend:8001"]

  # ─── Blackbox: внешние HTTP проверки ───────────────────────────────────────
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://msp-claude.online
          - https://msp-claude.online/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-https-strict
    metrics_path: /probe
    params:
      module: [https_strict]
    static_configs:
      - targets:
          - https://msp-claude.online
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-smtp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          # Stalwart доступен Blackbox через общую msp_default сеть.
          # Внешний DNS нельзя использовать: Docker DNS может вернуть
          # hostname другого контейнера, а host-gateway не видит published port.
          - stalwart:465
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ─── Blackbox: внутренние сервисы (через Docker сеть) ──────────────────────
  - job_name: blackbox-internal
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # Vaultwarden — менеджер паролей
          - http://vaultwarden:80
          # Grafana — мониторинг
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-imap
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - stalwart:993
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
