# ──────────────────────────────────────────────────────────────
# ansible.cfg · MSPShield
# ──────────────────────────────────────────────────────────────
# ВНИМАНИЕ: альтернативный контур Terraform + nginx/systemd, не текущий Compose.
# Не использовать этот файл для первых занятий: docs/training/ansible/examples/.
# RU: Перед запуском Ansible выставить переменную окружения:
#   export BASTION_PUBLIC_IP=$(terraform -chdir=../../../infra/terraform output -raw bastion_public_ip)
# Иначе ProxyJump сломается.
# ──────────────────────────────────────────────────────────────

[defaults]
# Инвентарь описывает landing-VM, bastion-VM и тенантов.
inventory            = inventory/prod.yml
# Историческое небезопасное значение: оно отключает проверку подлинности SSH-узла.
# До реального запуска настроить known_hosts и ANSIBLE_HOST_KEY_CHECKING=True.
# Пересоздание VM требует сверки нового fingerprint, а не доверия любому ключу.
host_key_checking    = False
# Не оставляем *.retry файлы в репо.
retry_files_enabled  = False
# Человеко-читаемый вывод.
stdout_callback      = yaml
# Ускоряет команды (несколько задач в одной SSH-сессии).
pipelining           = True
# Параллельность: 10 хостов одновременно. Для патчей снижается через serial.
forks                = 10
roles_path           = roles
collections_paths    = collections

[ssh_connection]
# ProxyJump задаёт промежуточный SSH-узел; это не то же самое, что VPN-маршрут.
# Развёртывание $BASTION_PUBLIC_IP зависит от обработки команды SSH: проверить
# effective connection отдельно, не считать запись здесь подтверждением маршрута.
# ControlMaster/ControlPersist — переиспользуем SSH-туннель между задачами.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ProxyJump=ubuntu@$BASTION_PUBLIC_IP
